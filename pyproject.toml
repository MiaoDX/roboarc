[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "roboarc"
version = "0.1.0.dev0"
description = "Robot Action Representation & Composition"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "RoboArc contributors" }]
dependencies = [
  "fastapi>=0.128,<0.129",
  "pydantic>=2.13,<2.14",
  "uvicorn>=0.48,<0.49",
]

[project.optional-dependencies]
rerun = [
  "rerun-sdk>=0.31,<0.32",
]
dev = [
  "pytest>=9,<10",
  "pytest-asyncio>=1.3,<2",
  "httpx>=0.28,<0.29",
  "websockets>=15,<16",
  "mypy>=1.15,<2",
  "ruff>=0.9,<1",
]

[project.scripts]
roboarc = "roboarc.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["roboarc"]
