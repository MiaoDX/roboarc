name: core-ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: core-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Compile Python sources
        run: python -m compileall -q src scripts

      - name: Run Ruff
        run: ruff check .

      - name: Run Mypy
        run: mypy src/roboarc

      - name: Run test suite
        run: python -m pytest

      - name: Verify generated schemas are current
        run: |
          python scripts/generate_schemas.py
          git diff --exit-code -- schemas

  web:
    name: Web workbench
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Set up Python for browser runtime
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install runtime for browser tests
        working-directory: .
        run: python -m pip install -e ".[dev]"
      - name: Install Web dependencies
        run: npm ci
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Check formatting
        run: npm run format:check
      - name: Run ESLint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Run Web tests
        run: npm test -- --run
      - name: Check vendored schemas
        run: npm run schemas:check
      - name: Build Web app
        run: npm run build
      - name: Run browser workflows
        run: npm run test:e2e
      - name: Audit dependencies
        run: npm audit --audit-level=high
